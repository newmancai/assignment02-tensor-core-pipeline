<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc" font-family="Noto Sans CJK SC, sans-serif">
  <title id="title">双分支 Agent 的知识驱动探索地形</title>
  <desc id="desc">两条弯曲且粗细不同的路径表示 HMMA 与 TCGEN05 分支。线宽表示搜索投入，透明度表示当前确信，短支流记录被否定的方向，底部的沉积层记录写回 Experience IR 的知识。</desc>
  <defs>
    <radialGradient id="hmmaFog" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#357fb5" stop-opacity=".30"/><stop offset="1" stop-color="#357fb5" stop-opacity="0"/></radialGradient>
    <radialGradient id="tcgenFog" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#df7448" stop-opacity=".30"/><stop offset="1" stop-color="#df7448" stop-opacity="0"/></radialGradient>
    <linearGradient id="sediment" x1="0" x2="1"><stop offset="0" stop-color="#edf4f8"/><stop offset=".46" stop-color="#f1f5f3"/><stop offset="1" stop-color="#fbf0ea"/></linearGradient>
    <marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#64a7d5"/></marker>
    <marker id="arrowOrange" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#e58a61"/></marker>
    <style>
      .kicker{font-size:22px;font-weight:600;letter-spacing:2px;fill:#9a742e}.title{font-size:48px;font-weight:650;fill:#151a21}.sub{font-size:23px;font-weight:400;fill:#66707a}
      .head{font-size:27px;font-weight:600;fill:#151a21}.label{font-size:22px;font-weight:500;fill:#2c333b}.small{font-size:18px;font-weight:400;fill:#66707a}.tiny{font-size:16px;font-weight:400;fill:#7e8994}
      .blue{fill:#2c6f9c}.orange{fill:#c76740}.green{fill:#2f7a68}.red{fill:#aa514b}.gold{fill:#9a742e}.ghost{stroke:#9aa6ae;stroke-width:2;stroke-dasharray:4 12;stroke-linecap:round;fill:none;opacity:.58}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <ellipse cx="760" cy="414" rx="560" ry="260" fill="url(#hmmaFog)"/>
  <ellipse cx="1140" cy="670" rx="610" ry="290" fill="url(#tcgenFog)"/>
  <ellipse cx="1670" cy="494" rx="290" ry="360" fill="#2f7a68" opacity=".055"/>
