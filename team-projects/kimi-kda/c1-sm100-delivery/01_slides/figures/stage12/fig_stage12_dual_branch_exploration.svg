<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">双分支 Agent 的知识驱动探索闭环</title>
  <desc id="desc">布局、驻留、调度、并行和数值角色提出 typed patch，协调器组合合法候选并分配到 HMMA 与 TCGEN05 两条支路。实验经过身份、正确性和测量作用域门槛后形成判断，写回带适用范围的经验 IR，并据此关闭重复方向或开启新轴。</desc>
  <defs>
    <style>
      .title{font:600 40px "Noto Sans CJK SC",sans-serif;fill:#151a21}.sub{font:400 22px "Noto Sans CJK SC",sans-serif;fill:#66707a}
      .kicker{font:600 17px "Noto Sans CJK SC",sans-serif;letter-spacing:1px;fill:#66707a}.head{font:600 25px "Noto Sans CJK SC",sans-serif;fill:#151a21}
      .label{font:500 20px "Noto Sans CJK SC",sans-serif;fill:#2c333b}.small{font:400 17px "Noto Sans CJK SC",sans-serif;fill:#66707a}
      .tiny{font:400 15px "Noto Sans CJK SC",sans-serif;fill:#66707a}.white{fill:#fff}.head.white,.label.white,.small.white,.tiny.white,.kicker.white{fill:#fff!important}.blue{fill:#2c5f91}.orange{fill:#c66a3d}.green{fill:#2f7a68}.red{fill:#a84d47}
      .rule{stroke:#d9d6cf;stroke-width:1.5}.flow{stroke:#7b8793;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.feedback{stroke:#2f7a68;stroke-width:2.5;stroke-dasharray:8 7;fill:none;marker-end:url(#arrow-green)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#7b8793"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#2f7a68"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="#faf9f6"/>
  <text x="74" y="72" class="kicker" fill="#d2aa52">07  分析方法</text>
  <text x="74" y="126" class="title">双分支 Agent 的知识驱动探索闭环</text>
  <text x="74" y="165" class="sub">每轮的产物不只是更快候选，还包括失败边界、适用条件和下一项值得验证的假设</text>
  <line x1="74" y1="194" x2="1846" y2="194" class="rule"/>
  <text x="78" y="234" class="kicker">互补角色只提交 TYPED PATCH</text>
  <g transform="translate(78 250)">
    <rect x="0" y="0" width="214" height="48" rx="4" fill="#e9eff6"/><text x="107" y="31" text-anchor="middle" class="label blue">layout 布局</text>
    <rect x="226" y="0" width="214" height="48" rx="4" fill="#e7f1ed"/><text x="333" y="31" text-anchor="middle" class="label green">residency 驻留</text>
    <rect x="452" y="0" width="214" height="48" rx="4" fill="#ece9e2"/><text x="559" y="31" text-anchor="middle" class="label">scheduler 调度</text>
    <rect x="678" y="0" width="214" height="48" rx="4" fill="#f5eae3"/><text x="785" y="31" text-anchor="middle" class="label orange">parallelism 并行</text>
    <rect x="904" y="0" width="214" height="48" rx="4" fill="#fff5df"/><text x="1011" y="31" text-anchor="middle" class="label">numerics 数值</text>
  </g>
  <g>
    <rect x="78" y="348" width="254" height="248" rx="6" fill="#fff" stroke="#d9d6cf" stroke-width="1.5"/>
    <text x="102" y="385" class="kicker">01 机会模型</text><text x="102" y="426" class="head">从缺口提出假设</text>
    <line x1="102" y1="446" x2="305" y2="446" class="rule"/>
    <text x="102" y="480" class="small">性能差距落在哪个机制</text><text x="102" y="513" class="small">现有证据遗漏了哪个轴</text>
    <text x="102" y="546" class="small">什么结果会推翻假设</text><text x="102" y="579" class="tiny">输入：profile、瓶颈、开放边界</text>
    <rect x="378" y="348" width="284" height="248" rx="6" fill="#101d2e"/>
    <text x="404" y="385" class="kicker" style="fill:#fff">02 协调器</text><text x="404" y="426" class="head" style="fill:#fff">组合与静态判断</text>
    <line x1="404" y1="447" x2="636" y2="447" stroke="#39485a" stroke-width="1.5"/>
    <text x="404" y="482" class="small" style="fill:#fff">同轴冲突拒绝</text><text x="404" y="515" class="small" style="fill:#fff">物理协议 verifier</text>
    <text x="404" y="548" class="small" style="fill:#fff">canonical ID 去重</text><text x="404" y="579" class="tiny" style="fill:#fff">输出：可执行 KernelDesign</text>
  </g>
  <path d="M332 472H378" class="flow"/>
  <g>
    <text x="724" y="337" class="kicker">03 同预算双分支</text>
    <rect x="712" y="356" width="566" height="112" rx="6" fill="#e9eff6" stroke="#2c5f91" stroke-width="2"/>
    <rect x="712" y="356" width="12" height="112" fill="#2c5f91"/>
    <text x="750" y="391" class="head blue">HMMA 兼容支路</text><text x="750" y="426" class="label">映射与 warp 密度 patch</text>
    <text x="1040" y="393" class="small">隔离构建</text><text x="1040" y="426" class="small">公开接口复测</text><line x1="1008" y1="382" x2="1008" y2="442" stroke="#b7c8da" stroke-width="1.5"/>
    <rect x="712" y="484" width="566" height="112" rx="6" fill="#f5eae3" stroke="#c66a3d" stroke-width="2"/>
    <rect x="712" y="484" width="12" height="112" fill="#c66a3d"/>
    <text x="750" y="519" class="head orange">TCGEN05 原生支路</text><text x="750" y="554" class="label">layout · carrier · lifetime</text>
    <text x="1040" y="521" class="small">物理约束</text><text x="1040" y="554" class="small">机制探针</text><line x1="1008" y1="510" x2="1008" y2="570" stroke="#e7c8b8" stroke-width="1.5"/>
  </g>
  <path d="M662 472H712" class="flow"/>
  <g>
    <rect x="1334" y="348" width="260" height="248" rx="6" fill="#fff" stroke="#d9d6cf" stroke-width="1.5"/>
    <text x="1360" y="385" class="kicker">04 证据合同</text><text x="1360" y="426" class="head">先决定能否比较</text>
    <line x1="1360" y1="447" x2="1568" y2="447" class="rule"/>
    <text x="1360" y="482" class="small">实际加载路径与指令身份</text><text x="1360" y="515" class="small">output 与 final state</text>
    <text x="1360" y="548" class="small">同 workload 与计时范围</text><text x="1360" y="579" class="tiny">失败时不进入性能排序</text>
  </g>
  <path d="M1278 472H1334" class="flow"/>
  <g>
    <rect x="1642" y="348" width="204" height="248" rx="6" fill="#fff" stroke="#d9d6cf" stroke-width="1.5"/>
    <text x="1668" y="385" class="kicker">05 判断</text>
    <circle cx="1678" cy="438" r="8" fill="#2f7a68"/><text x="1700" y="445" class="label">qualified</text>
    <circle cx="1678" cy="492" r="8" fill="#a84d47"/><text x="1700" y="499" class="label">below gate</text>
    <path d="M1670 541l16 16m0-16l-16 16" stroke="#a84d47" stroke-width="3"/><text x="1700" y="557" class="label">rejected</text>
    <text x="1668" y="582" class="tiny">判断必须带理由</text>
  </g>
  <path d="M1594 472H1642" class="flow"/>
  <g>
    <rect x="930" y="688" width="664" height="230" rx="7" fill="#e7f1ed" stroke="#2f7a68" stroke-width="2"/>
    <text x="962" y="730" class="kicker green">06 SCOPED EXPERIENCE IR</text><text x="962" y="774" class="head">知识写回以后，下一轮不会从零开始</text>
    <line x1="962" y1="795" x2="1562" y2="795" stroke="#bad6cc" stroke-width="1.5"/>
    <text x="962" y="831" class="label">结论</text><text x="1052" y="831" class="small">晋级、关闭局部轴，或保留证伪卡</text>
    <text x="962" y="864" class="label">作用域</text><text x="1052" y="864" class="small">route、profile、驻留长度、计时范围</text>
    <text x="962" y="897" class="label">重开条件</text><text x="1052" y="897" class="small">新算法、新布局证明、完整 public-call 或新 workload</text>
  </g>
  <path d="M1744 596V640H1538V688" class="flow"/>
  <g>
    <rect x="378" y="688" width="472" height="230" rx="7" fill="#fff" stroke="#d2aa52" stroke-width="2"/>
    <text x="410" y="730" class="kicker" fill="#9b762b">07 下一轮机会模型</text><text x="410" y="774" class="head">知识改变搜索空间</text>
    <line x1="410" y1="795" x2="818" y2="795" class="rule"/>
    <text x="410" y="833" class="small">已关闭旋钮不重复采样</text><text x="410" y="866" class="small">保留不同 niche 的有效机制</text>
    <text x="410" y="899" class="small">只有新增机会才重新开域</text>
  </g>
  <path d="M930 803H850" class="feedback"/><path d="M378 803H228V596" class="feedback"/>
  <g transform="translate(78 968)">
    <line x1="0" y1="0" x2="1768" y2="0" class="rule"/>
    <text x="0" y="42" class="label">闭环价值</text><text x="128" y="42" class="small">更快候选进入 niche elite；失败候选留下可复用边界；证据不足的方向保留为开放问题</text>
    <text x="1768" y="42" text-anchor="end" class="tiny">Stage 12 · B300 SM103a</text>
  </g>
</svg>
