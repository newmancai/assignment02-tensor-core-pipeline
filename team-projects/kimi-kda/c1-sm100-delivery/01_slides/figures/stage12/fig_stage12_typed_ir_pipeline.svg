<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc" font-family="Noto Sans CJK SC, sans-serif">
  <title id="title">P3、BF16 ROUND 与 P4 的 Typed IR 价值流</title>
  <desc id="desc">价值流经过 P3 tcgen05、FP32 累加、BF16 舍入语义边界、32 字节 swizzled shared carrier 和 P4 tcgen05。P3 与 P4 复用一次 TMEM 分配与同一累加列，未经 layout proof 的 D fragment 到 A TMEM 捷径被拒绝。</desc>
  <defs>
    <linearGradient id="valueRibbon" x1="0" x2="1"><stop offset="0" stop-color="#2f6f9c"/><stop offset=".42" stop-color="#d56e46"/><stop offset=".56" stop-color="#d4a64f"/><stop offset="1" stop-color="#2f7a68"/></linearGradient>
    <linearGradient id="tmemLife" x1="0" x2="1"><stop offset="0" stop-color="#2f7a68" stop-opacity=".18"/><stop offset=".45" stop-color="#2f7a68" stop-opacity=".65"/><stop offset="1" stop-color="#2f7a68" stop-opacity=".22"/></linearGradient>
    <radialGradient id="roundHalo"><stop offset="0" stop-color="#d2aa52" stop-opacity=".34"/><stop offset="1" stop-color="#d2aa52" stop-opacity="0"/></radialGradient>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#39434d"/></marker>
    <style>
      .kicker{font-size:21px;font-weight:600;letter-spacing:2px;fill:#b07f2c}.title{font-size:47px;font-weight:650;fill:#12171d}.sub{font-size:22px;font-weight:400;fill:#65707a}
      .head{font-size:27px;font-weight:600;fill:#151a21}.label{font-size:21px;font-weight:500;fill:#25303a}.small{font-size:18px;font-weight:400;fill:#66717b}.tiny{font-size:16px;font-weight:400;fill:#7b858e}.mono{font-family:SFMono-Regular, Menlo, monospace;font-size:18px;font-weight:500;fill:#2f3942}
      .blue{fill:#2f6f9c}.orange{fill:#c76740}.green{fill:#2f7a68}.red{fill:#aa514b}.gold{fill:#9a742e}.hair{stroke:#d9d6cf;stroke-width:1.4;fill:none}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <text x="76" y="70" class="kicker">08  分析方法</text>
  <text x="76" y="132" class="title">Typed IR 把语义与物理协议摆在同一条流上</text>
  <text x="76" y="176" class="sub">每个节点都携带 shape、dtype、layout、carrier 与 lifetime，不合法的组合不会进入 CUDA</text>
  <path d="M76 207 C520 198, 1060 220, 1844 202" class="hair"/>

  <!-- 主价值流：一条有拐点的带，不用等宽流程框 -->
  <path d="M150 390 C310 312, 420 324, 560 384 C720 454, 826 430, 944 358 C1050 292, 1178 348, 1288 426 C1428 524, 1570 466, 1776 372" stroke="url(#valueRibbon)" stroke-width="24" stroke-linecap="round" fill="none"/>
  <path d="M150 390 C310 312, 420 324, 560 384 C720 454, 826 430, 944 358 C1050 292, 1178 348, 1288 426 C1428 524, 1570 466, 1776 372" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none" opacity=".8"/>
  <circle cx="150" cy="390" r="15" fill="#2f6f9c"/><circle cx="560" cy="384" r="26" fill="#c76740" stroke="#ffffff" stroke-width="5"/><circle cx="820" cy="420" r="20" fill="#2f7a68" stroke="#ffffff" stroke-width="4"/><circle cx="1050" cy="322" r="25" fill="#111b25" stroke="#d2aa52" stroke-width="5"/><circle cx="1288" cy="426" r="20" fill="#d2aa52" stroke="#ffffff" stroke-width="4"/><circle cx="1516" cy="486" r="26" fill="#c76740" stroke="#ffffff" stroke-width="5"/><circle cx="1776" cy="372" r="16" fill="#2f7a68"/>
  <ellipse cx="1050" cy="322" rx="150" ry="130" fill="url(#roundHalo)"/>

  <text x="118" y="316" class="head blue">A0 × INV</text><text x="118" y="344" class="mono">bf16 · shared_MK</text>
  <text x="500" y="302" class="head orange">P3 tcgen05</text><text x="500" y="331" class="mono">mma.async</text>
  <text x="708" y="500" class="head green">D3 accumulator</text><text x="708" y="529" class="mono">fp32 · tmem[col]</text>
  <text x="954" y="252" class="head">BF16 ROUND</text><text x="954" y="282" class="small gold">不可跨越的语义缩颈</text>
  <text x="1164" y="514" class="head gold">U shared carrier</text><text x="1164" y="544" class="mono">bf16 · 32B-swizzled NK</text>
  <text x="1438" y="390" class="head orange">P4 tcgen05</text><text x="1438" y="420" class="mono">U × MQK</text>
  <text x="1660" y="310" class="head green">D4 / output</text><text x="1660" y="339" class="mono">fp32 · verified</text>

  <!-- 物理生命线：一次分配跨两次 MMA -->
  <text x="78" y="672" class="kicker green">RESOURCE LIFETIME</text>
  <path d="M282 764 C480 712, 646 738, 812 774 C986 811, 1182 752, 1390 770 C1520 782, 1640 770, 1772 724 L1772 824 C1580 860, 1440 844, 1270 838 C1030 830, 842 886, 632 836 C490 802, 378 802, 282 836Z" fill="url(#tmemLife)" stroke="#2f7a68" stroke-width="2"/>
  <path d="M312 798 C566 750, 744 834, 980 814 C1210 794, 1448 846, 1738 770" stroke="#2f7a68" stroke-width="4" stroke-linecap="round" fill="none"/>
  <text x="120" y="794" class="head green">TMEM</text><text x="120" y="824" class="small">一次分配</text>
  <text x="350" y="748" class="label">alloc once</text><text x="730" y="868" class="small">P3 accumulation</text><text x="1110" y="868" class="small">same columns stay live</text><text x="1600" y="868" class="small">read + free</text>
  <path d="M560 740 C604 716, 646 714, 690 726" stroke="#c76740" stroke-width="12" stroke-linecap="round" fill="none"/><text x="540" y="710" class="small orange">P3 issue</text>
  <path d="M1408 742 C1450 722, 1502 722, 1544 736" stroke="#c76740" stroke-width="12" stroke-linecap="round" fill="none"/><text x="1400" y="710" class="small orange">P4 issue</text>

  <!-- 被 verifier 拒绝的捷径 -->
  <path d="M812 438 C898 540, 1110 608, 1398 560" stroke="#aa514b" stroke-width="3" stroke-dasharray="10 12" fill="none" marker-end="url(#arrow)" opacity=".68"/>
  <path d="M1086 553l24 24m0-24l-24 24" stroke="#aa514b" stroke-width="4"/>
  <text x="870" y="590" class="label red">D fragment → A TMEM 捷径</text><text x="870" y="619" class="small red">缺少 layout proof，Typed Verifier 在生成 CUDA 前拒绝</text>

  <path d="M74 916 C394 894, 714 936, 1020 910 C1322 884, 1580 930, 1844 900" class="hair"/>
  <text x="78" y="958" class="kicker">MECHANISM DECISION</text>
  <text x="78" y="1001" class="head">inner64 长驻留：1.430–1.446× vs HMMA</text>
  <text x="710" y="1001" class="label">inner1 固定成本占主导，回退 HMMA</text>
  <text x="1310" y="1001" class="label green">完整 public-call 仍需重新取证</text>
  <text x="1840" y="1048" text-anchor="end" class="tiny">P3/P4 mechanism probe · Stage 12 · B300 SM103a</text>
</svg>
