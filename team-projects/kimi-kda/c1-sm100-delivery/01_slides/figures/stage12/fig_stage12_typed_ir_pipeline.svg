<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">P3、BF16 ROUND 与 P4 的 Typed IR 流水及 TMEM 生命周期</title>
  <desc id="desc">P3 与 P4 两次 TCGEN05 MMA 共用一次 TMEM 分配和同一累加列。P3 的 FP32 D fragment 在 ROUND 语义边界后通过 32 字节 swizzled shared carrier 形成 P4 的 BF16 A 操作数。直接 D fragment 到 A TMEM 的未证明转换被类型检查拒绝。</desc>
  <defs>
    <style>
      .title{font:600 40px "Noto Sans CJK SC",sans-serif;fill:#151a21}.sub{font:400 22px "Noto Sans CJK SC",sans-serif;fill:#66707a}
      .kicker{font:600 17px "Noto Sans CJK SC",sans-serif;letter-spacing:1px;fill:#66707a}.head{font:600 24px "Noto Sans CJK SC",sans-serif;fill:#151a21}
      .label{font:500 19px "Noto Sans CJK SC",sans-serif;fill:#2c333b}.small{font:400 16px "Noto Sans CJK SC",sans-serif;fill:#66707a}
      .tiny{font:400 14px "Noto Sans CJK SC",sans-serif;fill:#66707a}.mono{font:500 16px "SFMono-Regular",Menlo,monospace;fill:#2c333b}.white{fill:#fff}.head.white,.label.white,.small.white,.tiny.white,.kicker.white,.mono.white{fill:#fff!important}
      .rule{stroke:#d9d6cf;stroke-width:1.4}.grid{stroke:#e4e1da;stroke-width:1}.flow{stroke:#7b8793;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#7b8793"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="#faf9f6"/>
  <text x="74" y="72" class="kicker" fill="#d2aa52">08  分析方法</text>
  <text x="74" y="126" class="title">P3、BF16 ROUND 与 P4 的 Typed IR 流水</text>
  <text x="74" y="165" class="sub">类型同时约束 shape、dtype、layout、carrier 和 lifetime，非法组合在生成 CUDA 之前终止</text>
  <line x1="74" y1="194" x2="1846" y2="194" class="rule"/>

  <text x="78" y="236" class="kicker">VALUE FLOW</text>
  <g transform="translate(78 258)">
    <rect x="0" y="0" width="226" height="82" rx="5" fill="#e9eff6" stroke="#2c5f91" stroke-width="1.6"/>
    <text x="113" y="31" text-anchor="middle" class="label">A0 × INV</text><text x="113" y="59" text-anchor="middle" class="mono">bf16 · shared_MK</text>
    <path d="M226 41H286" class="flow"/>
    <rect x="286" y="0" width="168" height="82" rx="5" fill="#f5eae3" stroke="#c66a3d" stroke-width="2"/>
    <text x="370" y="31" text-anchor="middle" class="head" fill="#c66a3d">P3 tcgen05</text><text x="370" y="59" text-anchor="middle" class="mono">mma.async</text>
    <path d="M454 41H514" class="flow"/>
    <rect x="514" y="0" width="226" height="82" rx="5" fill="#fff" stroke="#2f7a68" stroke-width="1.8"/>
    <text x="627" y="31" text-anchor="middle" class="label">D3 accumulator</text><text x="627" y="59" text-anchor="middle" class="mono">fp32 · tmem[col]</text>
    <path d="M740 41H802" class="flow"/>
    <rect x="802" y="-10" width="194" height="102" rx="5" fill="#101d2e"/>
    <text x="899" y="30" text-anchor="middle" class="head" style="fill:#fff">BF16 ROUND</text><text x="899" y="60" text-anchor="middle" class="tiny" style="fill:#fff">semantic boundary</text>
    <path d="M996 41H1058" class="flow"/>
    <rect x="1058" y="0" width="260" height="82" rx="5" fill="#fff5df" stroke="#d2aa52" stroke-width="1.8"/>
    <text x="1188" y="31" text-anchor="middle" class="label">U shared carrier</text><text x="1188" y="59" text-anchor="middle" class="mono">bf16 · 32B-swizzled NK</text>
    <path d="M1318 41H1378" class="flow"/>
    <rect x="1378" y="0" width="168" height="82" rx="5" fill="#f5eae3" stroke="#c66a3d" stroke-width="2"/>
    <text x="1462" y="31" text-anchor="middle" class="head" fill="#c66a3d">P4 tcgen05</text><text x="1462" y="59" text-anchor="middle" class="mono">U × MQK</text>
    <path d="M1546 41H1606" class="flow"/>
    <rect x="1606" y="0" width="222" height="82" rx="5" fill="#e7f1ed" stroke="#2f7a68" stroke-width="1.8"/>
    <text x="1717" y="31" text-anchor="middle" class="label">D4 / final output</text><text x="1717" y="59" text-anchor="middle" class="mono">fp32 · verified</text>
  </g>

  <text x="78" y="394" class="kicker">PIPELINE AND RESOURCE LIFETIME</text>
  <g>
    <text x="248" y="424" class="tiny">t0</text><text x="438" y="424" class="tiny">t1</text><text x="628" y="424" class="tiny">t2</text><text x="818" y="424" class="tiny">t3</text>
    <text x="1008" y="424" class="tiny">t4</text><text x="1198" y="424" class="tiny">t5</text><text x="1388" y="424" class="tiny">t6</text><text x="1578" y="424" class="tiny">t7</text><text x="1768" y="424" class="tiny">t8</text>
    <line x1="264" y1="438" x2="1784" y2="438" class="rule"/>
    <g class="grid"><line x1="264" y1="438" x2="264" y2="824"/><line x1="454" y1="438" x2="454" y2="824"/><line x1="644" y1="438" x2="644" y2="824"/><line x1="834" y1="438" x2="834" y2="824"/><line x1="1024" y1="438" x2="1024" y2="824"/><line x1="1214" y1="438" x2="1214" y2="824"/><line x1="1404" y1="438" x2="1404" y2="824"/><line x1="1594" y1="438" x2="1594" y2="824"/><line x1="1784" y1="438" x2="1784" y2="824"/></g>
    <text x="78" y="490" class="label">control</text><text x="78" y="581" class="label">TCGEN issue</text><text x="78" y="672" class="label">TMEM columns</text><text x="78" y="763" class="label">shared carrier</text>
    <line x1="78" y1="518" x2="1784" y2="518" class="rule"/><line x1="78" y1="609" x2="1784" y2="609" class="rule"/><line x1="78" y1="700" x2="1784" y2="700" class="rule"/><line x1="78" y1="791" x2="1784" y2="791" class="rule"/>

    <rect x="274" y="462" width="152" height="42" rx="4" fill="#101d2e"/><text x="350" y="489" text-anchor="middle" class="small" style="fill:#fff">alloc once</text>
    <rect x="654" y="462" width="152" height="42" rx="4" fill="#fff5df" stroke="#d2aa52"/><text x="730" y="489" text-anchor="middle" class="small">commit / wait</text>
    <rect x="844" y="458" width="350" height="50" rx="4" fill="#101d2e"/><text x="1019" y="489" text-anchor="middle" class="small" style="fill:#fff">read D3 · ROUND · materialize U</text>
    <rect x="1414" y="462" width="152" height="42" rx="4" fill="#fff5df" stroke="#d2aa52"/><text x="1490" y="489" text-anchor="middle" class="small">commit / wait</text>
    <rect x="1604" y="462" width="152" height="42" rx="4" fill="#101d2e"/><text x="1680" y="489" text-anchor="middle" class="small" style="fill:#fff">read · free</text>

    <rect x="464" y="551" width="170" height="42" rx="4" fill="#c66a3d"/><text x="549" y="578" text-anchor="middle" class="small" style="fill:#fff">P3 issue</text>
    <rect x="1224" y="551" width="170" height="42" rx="4" fill="#c66a3d"/><text x="1309" y="578" text-anchor="middle" class="small" style="fill:#fff">P4 issue</text>

    <rect x="274" y="642" width="1482" height="42" rx="4" fill="#e7f1ed"/>
    <rect x="464" y="642" width="330" height="42" fill="#2f7a68"/><text x="629" y="669" text-anchor="middle" class="small" style="fill:#fff">P3 accumulation · same columns</text>
    <rect x="1224" y="642" width="342" height="42" fill="#2f7a68"/><text x="1395" y="669" text-anchor="middle" class="small" style="fill:#fff">P4 accumulation · same columns</text>
    <text x="1015" y="670" text-anchor="middle" class="tiny">one allocation spans both MMAs</text>

    <rect x="844" y="733" width="350" height="42" rx="4" fill="#d2aa52"/><text x="1019" y="760" text-anchor="middle" class="small">one safe 32B-swizzled shared carrier</text>
    <line x1="1024" y1="438" x2="1024" y2="824" stroke="#a84d47" stroke-width="2.5" stroke-dasharray="8 7"/>
    <text x="1024" y="816" text-anchor="middle" class="tiny" fill="#a84d47">BF16 ROUND blocks algebraic rewrite</text>
  </g>

  <g>
    <rect x="78" y="862" width="1118" height="126" rx="6" fill="#fff" stroke="#d9d6cf" stroke-width="1.5"/>
    <text x="106" y="898" class="kicker">TYPED VERIFIER</text>
    <text x="106" y="934" class="small">HMMA D fragment、TCGEN A TMEM operand 与 TCGEN accumulator 是不同物理类型</text>
    <text x="106" y="968" class="small">未经 layout proof 的 D3 直通 A TMEM 候选直接拒绝；shared carrier 逐 bit 正确后才进入计时</text>
    <rect x="1220" y="862" width="626" height="126" rx="6" fill="#e7f1ed" stroke="#2f7a68" stroke-width="1.8"/>
    <text x="1250" y="898" class="kicker" fill="#2f7a68">MECHANISM DECISION</text>
    <text x="1250" y="934" class="label">inner64 长驻留：1.430–1.446× vs HMMA</text>
    <text x="1250" y="968" class="small">inner1 固定成本占主导，回退 HMMA；完整 public-call 仍需重新取证</text>
  </g>
  <text x="1846" y="1044" text-anchor="end" class="tiny">P3/P4 mechanism probe · Stage 12 · B300 SM103a</text>
</svg>
